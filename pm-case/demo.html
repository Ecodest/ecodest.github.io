if (device === 'desktop' || device === 'mobile') document.documentElement.dataset.device = device;

<style>
html{scroll-behavior:smooth;scrollbar-width:none}
html::-webkit-scrollbar{display:none}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

@font-face{font-family:DemoRedHat;src:url("RedHatDisplay.ttf") format("truetype");font-weight:300 900;font-display:swap}
*{box-sizing:border-box}
body{margin:0;background:white;color:#171717;font:16px system-ui}
picture,img{display:block;width:100%;height:auto}
main{position:relative;container-type:inline-size}
a.jump,button.jump{position:absolute;display:block;border:0;background:transparent;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
.jump:focus-visible{outline:2px solid #93684d;outline-offset:2px}
.contact-jump{border-radius:1.65cqw;color:var(--hover-ink,#16110e);text-decoration:none}
.contact-jump::after{
  content:"Contact Me";position:absolute;inset:0;display:grid;place-items:center;
  border:1px solid var(--hover-border,transparent);border-radius:inherit;
  background:var(--hover-fill,#e59b74);font:400 1.9cqw/1 DemoRedHat,system-ui,sans-serif;
  opacity:0;transition:opacity 140ms ease;
}
.contact-jump[data-filled]{--hover-fill:#f1e5de;--hover-ink:#76533f;--hover-border:#ca9e84}
.contact-jump.mobile{border-radius:3.9cqw}
.contact-jump.mobile::after{font-size:5.5cqw}
@media(hover:hover) and (pointer:fine){.contact-jump:hover::after{opacity:1}}
.contact-jump:focus-visible::after,.contact-jump:active::after{opacity:1}
.contact-jump:active::after{background:#d48c64;color:#21130c;transition-duration:0ms}
.primary-jump{border-radius:.3cqw}
@media(hover:hover) and (pointer:fine){.primary-jump:hover{background:#fff2}}
.primary-jump:active{background:#fff3}

.demo-map{position:absolute;left:0;width:100%;transition:opacity 160ms ease-out}
.demo-map.is-complete{opacity:0;pointer-events:none}
.demo-map img,.demo-map svg{display:block;width:100%;height:100%}
.demo-map svg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.demo-map path{fill:none;stroke:#fff;stroke-width:var(--map-stroke);stroke-linecap:butt;stroke-linejoin:round;stroke-dasharray:1 1;stroke-dashoffset:1;opacity:0}
.demo-map text{fill:#fff;font:400 var(--map-font-size) DemoRedHat,system-ui,sans-serif;opacity:0}
.demo-map.is-revealing path{animation:map-line 420ms ease-out var(--delay) forwards}
.demo-map.is-revealing text{animation:map-label 200ms ease-out calc(var(--delay) + 310ms) forwards}
@keyframes map-line{from{opacity:1;stroke-dashoffset:1}to{opacity:1;stroke-dashoffset:0}}
@keyframes map-label{to{opacity:1}}
@media(prefers-reduced-motion:reduce){.demo-map{display:none!important}.contact-jump::after{transition:none}}
.anchor{position:absolute;left:0}
.mobile{display:none!important}
dialog{position:fixed;inset:0;width:100dvw;height:100dvh;max-width:none;max-height:none;border:0;padding:0;margin:0;overflow:hidden;background:white}
html:has(dialog:modal){overflow:hidden}
dialog::backdrop{background:white}
.menu-screen{position:relative;width:100%;height:100%}
.menu-screen img{width:100%;height:100%;object-fit:fill}
dialog nav{position:absolute;inset:22.9% 0 51.9%;display:grid;grid-template-rows:repeat(3,1fr)}
dialog nav a{display:block}
dialog nav a:focus-visible{outline:3px solid #d8a481;outline-offset:-5px}
.close{top:0;right:0;width:20%;height:10%}
html[data-device="mobile"] .desktop{display:none!important}
html[data-device="mobile"] .mobile{display:block!important}
@media(max-width:480px){
html:not([data-device]) .desktop{display:none!important}
html:not([data-device]) .mobile{display:block!important}
}
</style>

<script>
if (window.parent !== window) {
  function sendPosition() {
    const travel = document.documentElement.scrollHeight - window.innerHeight;
    window.parent.postMessage({type:'backfolio-scroll-position', position:travel > 0 ? window.scrollY / travel : 0}, '*');
  }
  window.addEventListener('scroll', sendPosition, {passive:true});
  window.addEventListener('message', event => {
    if (event.source !== window.parent || event.data?.type !== 'backfolio-scroll-to') return;
    const position = event.data.position;
    if (!Number.isFinite(position) || position < 0 || position > 1) return;
    window.scrollTo({top:position * (document.documentElement.scrollHeight - window.innerHeight), behavior:'instant'});
  });
}
const menu = document.querySelector('dialog');
const motion = matchMedia('(prefers-reduced-motion: reduce)');
const mapObserver = new IntersectionObserver(entries => {
  for (const { target, isIntersecting } of entries) {
    if (!isIntersecting || motion.matches) continue;
    mapObserver.unobserve(target);
    target.classList.add('is-revealing');
    target.querySelector('g:last-child text').addEventListener('animationend', () => {
      target.classList.add('is-complete');
    }, {once:true});
  }
}, {threshold:0.18});
for (const map of document.querySelectorAll('.demo-map')) mapObserver.observe(map);
document.querySelector('#open-menu').addEventListener('click', () => {
  menu.showModal();
  if (window.parent !== window) window.parent.postMessage({type:'backfolio-demo-interaction'}, '*');
});
for (const link of document.querySelectorAll('a[href^="#"]')) {
  link.addEventListener('click', event => {
    event.preventDefault();
    const section = document.querySelector(link.hash);
    if (menu.open) menu.close();
    section.focus({preventScroll:true});
    const top = window.scrollY + section.getBoundingClientRect().top;
    window.scrollTo({top, behavior:motion.matches ? 'instant' : 'smooth'});
  });
}
</script>
