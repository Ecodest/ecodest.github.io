<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Инноватика Системс — демо</title>
  <link rel="stylesheet" href="demo.css?v=scale-1">
  <script>
    const initialArtwork = document.createElement("link");
    initialArtwork.rel = "preload";
    initialArtwork.as = "image";
    initialArtwork.href = new URLSearchParams(location.search).get("device") === "desktop"
      ? "home-desktop.webp" : "home-mobile.webp";
    document.head.append(initialArtwork);
  </script>
  <script type="module" src="demo.js?v=partners-8"></script>
</head>
<body>
  <main class="layout" aria-label="Кликабельный макет">
    <img class="layout-image" fetchpriority="high" alt="">
    <div class="hotspots"></div>
  </main>
  <dialog class="panel" aria-labelledby="panel-title">
    <h1 id="panel-title" tabindex="-1"></h1>
    <button class="close" type="button" aria-label="Закрыть">×</button>
    <div class="panel-content"></div>
  </dialog>
</body>
</html>
